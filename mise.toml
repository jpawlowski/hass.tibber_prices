# Development tools of this project, the same in the DevContainer, in CI
# (jdx/mise-action) and locally: `mise install` installs them all.
#
# Python is not listed here: its version is in .python-version, the one the
# configured Home Assistant version is built on (scripts/setup/update-ha-version
# keeps it in step). mise reads that file, and so does uv. Python packages are
# uv's job (scripts/setup/bootstrap), not mise's.

[settings]
idiomatic_version_file_enable_tools = ["python"]

[tools]
node = "24.22.1"
uv = "0.13.5"
"npm:pyright" = "1.1.414"
"npm:prettier" = "3.9.10"
git-cliff = "2.14.2"
shellcheck = "0.11.0"
shfmt = "3.14.1"
yq = "4.54.1"
