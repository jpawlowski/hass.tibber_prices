# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      semver-patch-days: 3
      semver-minor-days: 7
    groups:
      # Bundle all minor/patch feature updates into a single PR; major updates stay separate
      devcontainer-features:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps)"
    # These two take a tool version beside their pin; Renovate raises both together (.github/renovate.json)
    ignore:
      - dependency-name: "trufflesecurity/trufflehog"
      - dependency-name: "jdx/mise-action"
    # Let new action versions settle for 7 days before opening a PR (same as HA Core)
    cooldown:
      default-days: 7
    groups:
      # Bundle all minor/patch action updates into a single PR; major updates stay separate
      github-actions:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  - package-ecosystem: "pip"
    directory: "/"
    # The integration's runtime requirements live in manifest.json as well, which Dependabot cannot read.
    # Renovate (.github/renovate.json) raises both files together; without it they are bumped by hand.
    exclude-paths:
      - "requirements.txt"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # homeassistant is a transitive dependency pulled in by pytest-homeassistant.
      # Its version must stay in sync with the "homeassistant" key in hacs.json — update that manually
      # when bumping pytest-homeassistant manually.
      - dependency-name: "homeassistant"
      # Each pytest-homeassistant release matches one Home Assistant release.
      # Keep this pinned and bump it manually together with hacs.json "homeassistant".
      - dependency-name: "pytest-homeassistant"
    # Let patch releases settle 3 days, minor releases 7 days before opening a PR
    cooldown:
      semver-patch-days: 3
      semver-minor-days: 7
    groups:
      # Bundle all minor/patch Python dep updates into a single PR; major updates stay separate.
      # pytest-homeassistant is intentionally excluded and ignored above,
      # because it is updated manually together with hacs.json "homeassistant".
      python-dependencies:
        applies-to: version-updates
        update-types:
          - minor
          - patch
        exclude-patterns:
          - "pytest-homeassistant"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      semver-patch-days: 3
      semver-minor-days: 7
    groups:
      # Bundle all minor/patch tooling updates into a single PR; major updates stay separate
      npm-dependencies:
        applies-to: version-updates
        update-types:
          - minor
          - patch
