name: PR Title

# A squash merge turns the pull request's title into the commit on main, and release-please
# builds the release notes from those commits, sorted by type (release-please-config.json).
# So the title has to be a Conventional Commit.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: PR title
    # Drafts may carry a working title. Every other event runs the check, a body edit included:
    # a skipped run would replace a failed one and count as passed.
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check the title against Conventional Commits
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          # The types of @commitlint/config-conventional; the header fits in 100 characters
          types='feat|fix|perf|build|docs|style|refactor|test|ci|chore|revert'
          pattern="^(${types})(\(([a-z0-9._/-]+)\))?!?: [^ ]"
          if [[ ! ${TITLE} =~ ${pattern} ]]; then
            echo "::error::\"${TITLE}\" is not a Conventional Commit title: <type>(<scope>): <summary>, type one of ${types//|/, }"
            exit 1
          fi
          # build is listed in the release notes as "Updated Dependencies": only the integration's
          # own requirements (Renovate's build(deps)) belong there
          if [[ ${BASH_REMATCH[1]} == build && ${BASH_REMATCH[3]} != deps ]]; then
            echo "::error::build is reserved for build(deps), the integration's requirements; use chore or ci"
            exit 1
          fi
          if (( ${#TITLE} > 100 )); then
            echo "::error::The title has ${#TITLE} characters, at most 100 fit the commit header"
            exit 1
          fi
          echo "✓ ${TITLE}"
