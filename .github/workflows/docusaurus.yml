name: Deploy Documentation

# Builds the user documentation site from main and publishes it to GitHub Pages. docs-check.yml builds the same site
# on pull requests: keep the setup and build steps in step.
#
# No tag trigger: a tag that release-please creates with GITHUB_TOKEN starts no workflow, and the per-release version
# snapshots it used to commit back to main are gone (a CI job that commits to main was the fragile part of the old
# release flow). The existing versioned_docs/ stay as they are.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".config/mise/conf.d/project.toml" # Node version
      - ".github/workflows/docusaurus.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build documentation site
    runs-on: ubuntu-24.04
    permissions:
      contents: read # check out the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Docusaurus reads the last update time of each page from git
          persist-credentials: false # npm ci runs the dependencies' install scripts

      # No cache in a workflow that publishes: a poisoned cache would reach the site
      - name: Set up Node and Python (mise.toml, .config/mise/conf.d/project.toml)
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: "node python"
          cache: false

      - name: Verify sensor reference is up-to-date
        run: python3 script/docs/generate-sensor-reference.py --check

      - name: Build user docs website
        working-directory: docs/user
        run: |
          npm ci
          npm run build

      - name: Assemble the documentation site
        run: |
          mkdir -p deploy-root/user
          cp docs/index.html deploy-root/
          cp -r docs/user/build/* deploy-root/user/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ./deploy-root

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write # publish the uploaded artifact
      id-token: write # deploy-pages authenticates with an OIDC token
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
