name: Validate

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"
  # Only what hassfest and the HACS action read: the integration, hacs.json and the README.
  # The nightly run still catches changes on their side and in the repository settings.
  push:
    branches:
      - main
    paths: &paths
      - "custom_components/**"
      - "hacs.json"
      - "README.md"
      - ".github/workflows/validate.yml"
  pull_request:
    branches:
      - main
    paths: *paths

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hassfest: # https://developers.home-assistant.io/blog/2020/04/16/hassfest
    name: Hassfest validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run hassfest validation
        uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361 # master

  hacs: # https://github.com/hacs/action
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - name: Run HACS validation
        uses: hacs/action@d556e736723344f83838d08488c983a15381059a # 22.5.0
        with:
          category: integration
