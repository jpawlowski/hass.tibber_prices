name: Release

# Releases come from release-please (release-please-config.json): every push to main updates
# one open release pull request with the next version and its CHANGELOG.md section. Merging
# that pull request writes the version into manifest.json, creates the tag and a draft release;
# the jobs below then build tibber_prices.zip from the tag, attach it and publish the release.
# The release stays a draft until its asset is attached, so no install ever finds it missing.
#
# A beta is a tag pushed by hand (vX.Y.ZbN, e.g. v0.40.0b0) on a commit on main: it skips the
# release pull request and becomes a pre-release with the same asset. release-please ignores it,
# since it reads the released version from .release-please-manifest.json.

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*b*"
  # Re-runs the asset job for a release whose upload failed; "Re-run all jobs" would create no
  # release and skip it.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the ZIP asset to and publish (e.g. v0.40.0)"
        required: true
        type: string

# Each job gets only what it needs (see the comment on each).
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # Also needs "Allow GitHub Actions to create and approve pull requests" under
    # Settings > Actions > General.
    permissions:
      contents: write # Create tags and draft releases
      pull-requests: write # Open and update the release pull request
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run release-please
        id: release
        # Reads release-please-config.json and .release-please-manifest.json
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0

  build:
    name: Build release asset
    needs: release-please
    if: >-
      !cancelled() && (needs.release-please.outputs.release_created == 'true'
      || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-24.04
    permissions:
      contents: read # No write token here: a build step may run third-party code (#271)
    env:
      TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name || github.ref_name }}
    outputs:
      tag: ${{ env.TAG }}
      prerelease: ${{ steps.kind.outputs.prerelease }}
    steps:
      - name: Tell a beta from a release
        id: kind
        run: |
          if [[ ${TAG} =~ b[0-9]+$ ]]; then echo "prerelease=true"; else echo "prerelease=false"; fi >> "$GITHUB_OUTPUT"

      - name: Checkout the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Fully qualified, so the shallow fetch creates refs/tags/<tag>, which build-asset reads
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false

      - name: Build release asset
        # Packs the tag, checks the manifest version (writes it for a beta) and the layout the
        # store installs
        run: ./scripts/release/build-asset "${TAG}" dist

      - name: Upload release asset
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-asset
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Attach asset and publish
    needs: build
    # Explicit: the default success() also counts release-please, which a beta tag or a manual
    # run skips, and would skip this job with it
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write # Upload the asset, publish the release
    env:
      TAG: ${{ needs.build.outputs.tag }}
    steps:
      - name: Download release asset
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-asset
          path: dist

      - name: Attach the asset, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            # release-please's draft (or a release whose upload failed before)
            gh release upload "${TAG}" dist/* --clobber --repo "${GITHUB_REPOSITORY}"
            gh release edit "${TAG}" --draft=false --repo "${GITHUB_REPOSITORY}"
          elif [[ ${PRERELEASE} == true ]]; then
            # A beta: no release pull request, so the notes come from GitHub (.github/release.yml)
            gh release create "${TAG}" dist/* --verify-tag --prerelease --generate-notes \
              --title "${TAG} (beta)" --repo "${GITHUB_REPOSITORY}"
          else
            echo "::error::No release for ${TAG}: stable releases come from the release pull request"
            exit 1
          fi
          {
            echo "**Tag:** ${TAG}"
            echo "**Asset:** $(ls dist)"
          } >> "$GITHUB_STEP_SUMMARY"

  docs:
    name: Version the docs
    needs: [build, publish]
    # Betas get no docs version (docusaurus.yml skips them too)
    if: >-
      ${{ !cancelled() && needs.publish.result == 'success'
      && needs.build.outputs.prerelease == 'false' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: write # Start docusaurus.yml: a tag created with GITHUB_TOKEN starts no workflow
    steps:
      - name: Start docusaurus.yml for the tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
        run: gh workflow run docusaurus.yml --ref "${TAG}" --repo "${GITHUB_REPOSITORY}"
