# Demo dashboard: prototype for a context-aware Tibber Prices dashboard and source for documentation
# screenshots. Design rationale: planning/dashboard-ux-plan.md (state matrix, naming rules).
#
# Placeholders, resolved by ./scripts/docs/demo/render-dashboard:
#   "entity:<translation_key>"   whole string -> entity_id of the demo entry (language independent)
#   "label:<key>"                whole string -> custom_translations/<lang>.json "dashboard.<key>"
#   [[entity:<key>]] [[label:<key>]]   same, inline inside longer strings (templates)
#   {"$chart": <name>, "hide_title": true}   card from charts/<name>.yaml (get_apexcharts_yaml output)
#
# Naming rule: a name only says what its heading does not already say.
title: Tibber Prices Demo
views:
  - title: Overview
    path: overview
    icon: mdi:flash
    type: sections
    max_columns: 2
    sections:
      # Question 1 + 2: should I use electricity now, and when is the next cheap window?
      # Tabs switch the time reference (15-min interval / rolling hour / in 1 hour) instead of
      # showing all three side by side. Needs "TabDeck Card" (tempus2016/tabdeck-card) from HACS.
      # The alert title already names the price level, so there is no separate level tile.
      - type: grid
        cards:
          - type: markdown
            text_only: true
            visibility: [{condition: state, entity: "entity:connection", state: "off"}]
            content: <ha-alert alert-type="error">[[label:connection_lost]]</ha-alert>
          - type: custom:tabdeck-card
            tabs:
              - name: "label:now"
                icon: mdi:progress-clock
                card:
                  type: vertical-stack
                  cards:
                    - type: grid
                      columns: 2
                      square: false
                      cards:
                        - {type: tile, entity: "entity:current_interval_price", name: "label:price"}
                        - {type: tile, entity: "entity:current_price_trend", name: "label:trend"}
                    # Every tab shows the span of its price at the same spot, so switching tabs
                    # moves nothing: the tiles come first, the variable-height verdict below
                    - type: markdown
                      text_only: true
                      content: >-
                        {% set start = (now().timestamp() // 900) * 900 %}<small>[[label:resolution_15min]] · {{ start | timestamp_custom('%H:%M') }}–{{ (start + 900) | timestamp_custom('%H:%M') }}</small>
                    # Verdict: periods come from the period sensors' "periods" attribute, so the same
                    # logic works for "now" and for the preview (time reference shifted by 0 s)
                    - type: markdown
                      text_only: true
                      content: >-
                        {% set now_ts = now().timestamp() %}
                        {% set t = now_ts + 0 %}
                        {% set cheap_until = as_timestamp(state_attr('[[entity:current_interval_price_level]]', 'cheap_until'), 0) %}
                        {% set next_cheap = as_timestamp(state_attr('[[entity:current_interval_price_level]]', 'next_cheap_start'), 0) %}
                        {% set ns = namespace(best=none, best_next=none, peak=none, peak_next=none) %}
                        {% for p in state_attr('[[entity:best_price_period]]', 'periods') or [] %}{% set s, e = as_timestamp(p.start), as_timestamp(p.end) %}{% if s <= t < e %}{% set ns.best = [s, e] %}{% elif s > t and ns.best_next is none %}{% set ns.best_next = [s, e] %}{% endif %}{% endfor %}
                        {% for p in state_attr('[[entity:peak_price_period]]', 'periods') or [] %}{% set s, e = as_timestamp(p.start), as_timestamp(p.end) %}{% if s <= t < e %}{% set ns.peak = [s, e] %}{% elif s > t and ns.peak_next is none %}{% set ns.peak_next = [s, e] %}{% endif %}{% endfor %}
                        {% macro hm(x) %}{{ x | timestamp_custom('%H:%M') }}{% endmacro %}
                        {% macro dur(x) %}{% set m = ((x - now_ts) / 60) | round(0) | int %}{{ (m // 60 ~ ' h ') if m >= 60 else '' }}{{ m % 60 }} min{% endmacro %}
                        {% set level = states('[[entity:current_interval_price_level]]') %}
                        {% if ns.best %}
                        <ha-alert alert-type="success" title="[[label:best_price_active]]">[[label:ends]] {{ hm(ns.best[1]) }} · [[label:remaining]]: {{ dur(ns.best[1]) }}{% if cheap_until > ns.best[1] %}<br>[[label:still_cheap]] {{ hm(cheap_until) }}{% endif %}</ha-alert>
                        {% elif ns.peak %}
                        <ha-alert alert-type="warning" title="[[label:peak_price_active]]">[[label:until]] {{ hm(ns.peak[1]) }}{% if ns.best_next %}<br>[[label:next_best_price]]: {{ hm(ns.best_next[0]) }} · [[label:in]] {{ dur(ns.best_next[0]) }}{% endif %}</ha-alert>
                        {% else %}
                        {% set kind = {'very_cheap': 'success', 'cheap': 'success', 'expensive': 'warning', 'very_expensive': 'warning'}.get(level, 'info') %}
                        <ha-alert alert-type="{{ kind }}" title="{{ state_translated('[[entity:current_interval_price_level]]') }}">{% set lines = [] %}{% if level in ['cheap', 'very_cheap'] %}{% if cheap_until %}{% set lines = lines + ['[[label:cheap_until]] ' ~ hm(cheap_until)] %}{% endif %}{% if ns.best_next %}{% set lines = lines + ['[[label:best_price_starts]]: ' ~ hm(ns.best_next[0]) ~ ' · [[label:in]] ' ~ dur(ns.best_next[0])] %}{% endif %}{% else %}{% if next_cheap and (not ns.best_next or next_cheap < ns.best_next[0]) %}{% set lines = lines + ['[[label:cheap_from]] ' ~ hm(next_cheap) ~ ' · [[label:in]] ' ~ dur(next_cheap)] %}{% endif %}{% if ns.best_next %}{% set lines = lines + ['[[label:next_best_price]]: ' ~ hm(ns.best_next[0]) ~ '–' ~ hm(ns.best_next[1]) ~ ' · [[label:in]] ' ~ dur(ns.best_next[0])] %}{% endif %}{% endif %}{% if ns.peak_next and ns.peak_next[0] - t < 3 * 3600 %}{% set lines = lines + ['[[label:next_peak_price]]: ' ~ hm(ns.peak_next[0]) ~ ' · [[label:in]] ' ~ dur(ns.peak_next[0])] %}{% endif %}{{ lines | join('<br>') }}</ha-alert>
                        {% endif %}
                    - type: tile
                      entity: "entity:best_price_progress"
                      name: "label:progress"
                      visibility: [{condition: state, entity: "entity:best_price_period", state: "on"}]
                    - type: tile
                      entity: "entity:peak_price_progress"
                      name: "label:progress"
                      visibility: [{condition: state, entity: "entity:peak_price_period", state: "on"}]
              - name: "label:current_hour"
                icon: mdi:update
                card:
                  type: vertical-stack
                  cards:
                    - type: grid
                      columns: 2
                      square: false
                      cards:
                        - {type: tile, entity: "entity:current_hour_average_price", name: "label:average"}
                        - {type: tile, entity: "entity:current_price_trend", name: "label:trend"}
                    # The rolling hour is centered on the current interval, not the clock hour: show its span
                    - type: markdown
                      text_only: true
                      content: >-
                        {% set start, end = state_attr('[[entity:current_hour_average_price]]', 'window_start'), state_attr('[[entity:current_hour_average_price]]', 'window_end') %}
                        {% if start and end %}<small>[[label:rolling_average]] · {{ as_timestamp(start) | timestamp_custom('%H:%M') }}–{{ as_timestamp(end) | timestamp_custom('%H:%M') }}</small>{% endif %}
                    # Verdict: periods come from the period sensors' "periods" attribute, so the same
                    # logic works for "now" and for the preview (time reference shifted by 0 s)
                    - type: markdown
                      text_only: true
                      content: >-
                        {% set now_ts = now().timestamp() %}
                        {% set t = now_ts + 0 %}
                        {% set cheap_until = as_timestamp(state_attr('[[entity:current_interval_price_level]]', 'cheap_until'), 0) %}
                        {% set next_cheap = as_timestamp(state_attr('[[entity:current_interval_price_level]]', 'next_cheap_start'), 0) %}
                        {% set ns = namespace(best=none, best_next=none, peak=none, peak_next=none) %}
                        {% for p in state_attr('[[entity:best_price_period]]', 'periods') or [] %}{% set s, e = as_timestamp(p.start), as_timestamp(p.end) %}{% if s <= t < e %}{% set ns.best = [s, e] %}{% elif s > t and ns.best_next is none %}{% set ns.best_next = [s, e] %}{% endif %}{% endfor %}
                        {% for p in state_attr('[[entity:peak_price_period]]', 'periods') or [] %}{% set s, e = as_timestamp(p.start), as_timestamp(p.end) %}{% if s <= t < e %}{% set ns.peak = [s, e] %}{% elif s > t and ns.peak_next is none %}{% set ns.peak_next = [s, e] %}{% endif %}{% endfor %}
                        {% macro hm(x) %}{{ x | timestamp_custom('%H:%M') }}{% endmacro %}
                        {% macro dur(x) %}{% set m = ((x - now_ts) / 60) | round(0) | int %}{{ (m // 60 ~ ' h ') if m >= 60 else '' }}{{ m % 60 }} min{% endmacro %}
                        {% set level = states('[[entity:current_hour_price_level]]') %}
                        {% if ns.best %}
                        <ha-alert alert-type="success" title="[[label:best_price_active]]">[[label:ends]] {{ hm(ns.best[1]) }} · [[label:remaining]]: {{ dur(ns.best[1]) }}{% if cheap_until > ns.best[1] %}<br>[[label:still_cheap]] {{ hm(cheap_until) }}{% endif %}</ha-alert>
                        {% elif ns.peak %}
                        <ha-alert alert-type="warning" title="[[label:peak_price_active]]">[[label:until]] {{ hm(ns.peak[1]) }}{% if ns.best_next %}<br>[[label:next_best_price]]: {{ hm(ns.best_next[0]) }} · [[label:in]] {{ dur(ns.best_next[0]) }}{% endif %}</ha-alert>
                        {% else %}
                        {% set kind = {'very_cheap': 'success', 'cheap': 'success', 'expensive': 'warning', 'very_expensive': 'warning'}.get(level, 'info') %}
                        <ha-alert alert-type="{{ kind }}" title="{{ state_translated('[[entity:current_hour_price_level]]') }}">{% set lines = [] %}{% if level in ['cheap', 'very_cheap'] %}{% if cheap_until %}{% set lines = lines + ['[[label:cheap_until]] ' ~ hm(cheap_until)] %}{% endif %}{% if ns.best_next %}{% set lines = lines + ['[[label:best_price_starts]]: ' ~ hm(ns.best_next[0]) ~ ' · [[label:in]] ' ~ dur(ns.best_next[0])] %}{% endif %}{% else %}{% if next_cheap and (not ns.best_next or next_cheap < ns.best_next[0]) %}{% set lines = lines + ['[[label:cheap_from]] ' ~ hm(next_cheap) ~ ' · [[label:in]] ' ~ dur(next_cheap)] %}{% endif %}{% if ns.best_next %}{% set lines = lines + ['[[label:next_best_price]]: ' ~ hm(ns.best_next[0]) ~ '–' ~ hm(ns.best_next[1]) ~ ' · [[label:in]] ' ~ dur(ns.best_next[0])] %}{% endif %}{% endif %}{% if ns.peak_next and ns.peak_next[0] - t < 3 * 3600 %}{% set lines = lines + ['[[label:next_peak_price]]: ' ~ hm(ns.peak_next[0]) ~ ' · [[label:in]] ' ~ dur(ns.peak_next[0])] %}{% endif %}{{ lines | join('<br>') }}</ha-alert>
                        {% endif %}
                    - type: tile
                      entity: "entity:best_price_progress"
                      name: "label:progress"
                      visibility: [{condition: state, entity: "entity:best_price_period", state: "on"}]
                    - type: tile
                      entity: "entity:peak_price_progress"
                      name: "label:progress"
                      visibility: [{condition: state, entity: "entity:peak_price_period", state: "on"}]
              - name: "label:in_1h"
                icon: mdi:clock-plus-outline
                card:
                  type: vertical-stack
                  cards:
                    - type: grid
                      columns: 1
                      square: false
                      cards:
                        - {type: tile, entity: "entity:next_hour_average_price", name: "label:average"}
                    # The rolling hour is centered on the current interval, not the clock hour: show its span
                    - type: markdown
                      text_only: true
                      content: >-
                        {% set start, end = state_attr('[[entity:next_hour_average_price]]', 'window_start'), state_attr('[[entity:next_hour_average_price]]', 'window_end') %}
                        {% if start and end %}<small>[[label:rolling_average]] · {{ as_timestamp(start) | timestamp_custom('%H:%M') }}–{{ as_timestamp(end) | timestamp_custom('%H:%M') }}</small>{% endif %}
                    # Verdict: periods come from the period sensors' "periods" attribute, so the same
                    # logic works for "now" and for the preview (time reference shifted by 3600 s)
                    - type: markdown
                      text_only: true
                      content: >-
                        {% set now_ts = now().timestamp() %}
                        {% set t = now_ts + 3600 %}
                        {% set cheap_until, next_cheap = 0, 0 %}
                        {% set ns = namespace(best=none, best_next=none, peak=none, peak_next=none) %}
                        {% for p in state_attr('[[entity:best_price_period]]', 'periods') or [] %}{% set s, e = as_timestamp(p.start), as_timestamp(p.end) %}{% if s <= t < e %}{% set ns.best = [s, e] %}{% elif s > t and ns.best_next is none %}{% set ns.best_next = [s, e] %}{% endif %}{% endfor %}
                        {% for p in state_attr('[[entity:peak_price_period]]', 'periods') or [] %}{% set s, e = as_timestamp(p.start), as_timestamp(p.end) %}{% if s <= t < e %}{% set ns.peak = [s, e] %}{% elif s > t and ns.peak_next is none %}{% set ns.peak_next = [s, e] %}{% endif %}{% endfor %}
                        {% macro hm(x) %}{{ x | timestamp_custom('%H:%M') }}{% endmacro %}
                        {% macro dur(x) %}{% set m = ((x - now_ts) / 60) | round(0) | int %}{{ (m // 60 ~ ' h ') if m >= 60 else '' }}{{ m % 60 }} min{% endmacro %}
                        {% set level = states('[[entity:next_hour_price_level]]') %}
                        {% if ns.best %}
                        <ha-alert alert-type="success" title="[[label:best_price_in_1h]]">[[label:ends]] {{ hm(ns.best[1]) }} · [[label:remaining]]: {{ dur(ns.best[1]) }}{% if cheap_until > ns.best[1] %}<br>[[label:still_cheap]] {{ hm(cheap_until) }}{% endif %}</ha-alert>
                        {% elif ns.peak %}
                        <ha-alert alert-type="warning" title="[[label:peak_price_in_1h]]">[[label:until]] {{ hm(ns.peak[1]) }}{% if ns.best_next %}<br>[[label:next_best_price]]: {{ hm(ns.best_next[0]) }} · [[label:in]] {{ dur(ns.best_next[0]) }}{% endif %}</ha-alert>
                        {% else %}
                        {% set kind = {'very_cheap': 'success', 'cheap': 'success', 'expensive': 'warning', 'very_expensive': 'warning'}.get(level, 'info') %}
                        <ha-alert alert-type="{{ kind }}" title="{{ state_translated('[[entity:next_hour_price_level]]') }}">{% set lines = [] %}{% if level in ['cheap', 'very_cheap'] %}{% if cheap_until %}{% set lines = lines + ['[[label:cheap_until]] ' ~ hm(cheap_until)] %}{% endif %}{% if ns.best_next %}{% set lines = lines + ['[[label:best_price_starts]]: ' ~ hm(ns.best_next[0]) ~ ' · [[label:in]] ' ~ dur(ns.best_next[0])] %}{% endif %}{% else %}{% if next_cheap and (not ns.best_next or next_cheap < ns.best_next[0]) %}{% set lines = lines + ['[[label:cheap_from]] ' ~ hm(next_cheap) ~ ' · [[label:in]] ' ~ dur(next_cheap)] %}{% endif %}{% if ns.best_next %}{% set lines = lines + ['[[label:next_best_price]]: ' ~ hm(ns.best_next[0]) ~ '–' ~ hm(ns.best_next[1]) ~ ' · [[label:in]] ' ~ dur(ns.best_next[0])] %}{% endif %}{% endif %}{% if ns.peak_next and ns.peak_next[0] - t < 3 * 3600 %}{% set lines = lines + ['[[label:next_peak_price]]: ' ~ hm(ns.peak_next[0]) ~ ' · [[label:in]] ' ~ dur(ns.peak_next[0])] %}{% endif %}{{ lines | join('<br>') }}</ha-alert>
                        {% endif %}
      # Question 3: what do the coming hours look like? Four zoom levels as tabs instead of
      # manual zooming. "Outlook" (auto-zoom) is the default: it hides the past and stays
      # forward-looking. Charts use the price level, so their colors match the verdict above.
      # Each zoom level offers 15-minute intervals or hourly averages.
      - type: grid
        cards:
          - type: custom:tabdeck-card
            # Build a tab when it is opened and drop it when it is left: ApexCharts hides the peak
            # price overlay (hidden_by_default) only once, right after the chart's first data load
            lazy: true
            unmount_hidden: true
            tabs:
              - name: "label:outlook"
                icon: mdi:chart-timeline-variant-shimmer
                card:
                  # 15 min / 1 h switch, remembered per browser (no helper) under one key for all zoom
                  # levels. TabDeck reads the stored tab only on page load, so after a reload every
                  # chart opens in the resolution chosen last; a switch doesn't reach the other charts live
                  type: custom:tabdeck-card
                  style: pill
                  position: bottom
                  align: end
                  remember: browser
                  storage_key: tibber_prices_chart_resolution
                  lazy: true
                  unmount_hidden: true
                  # Cancel the second 8px content padding: keeps the chart level with the tiles beside it
                  styles: {margin-top: -8px}
                  tabs:
                    - {name: "label:resolution_15min", card: {"$chart": outlook, "hide_title": true}}
                    - {name: "label:resolution_hourly", card: {"$chart": outlook_hourly, "hide_title": true}}
              - name: "label:today"
                icon: mdi:calendar-today
                card:
                  # 15 min / 1 h switch, remembered per browser (no helper) under one key for all zoom
                  # levels. TabDeck reads the stored tab only on page load, so after a reload every
                  # chart opens in the resolution chosen last; a switch doesn't reach the other charts live
                  type: custom:tabdeck-card
                  style: pill
                  position: bottom
                  align: end
                  remember: browser
                  storage_key: tibber_prices_chart_resolution
                  lazy: true
                  unmount_hidden: true
                  # Cancel the second 8px content padding: keeps the chart level with the tiles beside it
                  styles: {margin-top: -8px}
                  tabs:
                    - {name: "label:resolution_15min", card: {"$chart": today, "hide_title": true}}
                    - {name: "label:resolution_hourly", card: {"$chart": today_hourly, "hide_title": true}}
              # Only once tomorrow's prices exist: no empty chart, no layout jump when switching tabs
              - name: "label:tomorrow"
                icon: mdi:calendar-arrow-right
                visibility: [{condition: state, entity: "entity:tomorrow_data_available", state: "on"}]
                card:
                  # 15 min / 1 h switch, remembered per browser (no helper) under one key for all zoom
                  # levels. TabDeck reads the stored tab only on page load, so after a reload every
                  # chart opens in the resolution chosen last; a switch doesn't reach the other charts live
                  type: custom:tabdeck-card
                  style: pill
                  position: bottom
                  align: end
                  remember: browser
                  storage_key: tibber_prices_chart_resolution
                  lazy: true
                  unmount_hidden: true
                  # Cancel the second 8px content padding: keeps the chart level with the tiles beside it
                  styles: {margin-top: -8px}
                  tabs:
                    - {name: "label:resolution_15min", card: {"$chart": tomorrow, "hide_title": true}}
                    - {name: "label:resolution_hourly", card: {"$chart": tomorrow_hourly, "hide_title": true}}
              - name: "label:two_days"
                icon: mdi:calendar-range
                card:
                  # 15 min / 1 h switch, remembered per browser (no helper) under one key for all zoom
                  # levels. TabDeck reads the stored tab only on page load, so after a reload every
                  # chart opens in the resolution chosen last; a switch doesn't reach the other charts live
                  type: custom:tabdeck-card
                  style: pill
                  position: bottom
                  align: end
                  remember: browser
                  storage_key: tibber_prices_chart_resolution
                  lazy: true
                  unmount_hidden: true
                  # Cancel the second 8px content padding: keeps the chart level with the tiles beside it
                  styles: {margin-top: -8px}
                  tabs:
                    - {name: "label:resolution_15min", card: {"$chart": two_days, "hide_title": true}}
                    - {name: "label:resolution_hourly", card: {"$chart": two_days_hourly, "hide_title": true}}
      - type: grid
        cards:
          - type: heading
            heading: "label:today"
            icon: mdi:calendar-today
            badges:
              - type: entity
                entity: "entity:today_price_level"
                tap_action: {action: more-info}
                show_state: true
                show_icon: false
              - type: entity
                entity: "entity:today_volatility"
                tap_action: {action: more-info}
                show_state: true
                show_icon: true
          - type: glance
            columns: 3
            entities:
              - entity: "entity:lowest_price_today"
                name: "label:lowest"
              - entity: "entity:average_price_today"
                name: "label:average"
              - entity: "entity:highest_price_today"
                name: "label:highest"
      - type: grid
        cards:
          - type: heading
            heading: "label:tomorrow"
            icon: mdi:calendar-arrow-right
            badges:
              - type: entity
                entity: "entity:tomorrow_price_level"
                tap_action: {action: more-info}
                show_state: true
                show_icon: false
                visibility:
                  - condition: state
                    entity: "entity:tomorrow_data_available"
                    state: "on"
          - type: markdown
            text_only: true
            visibility:
              - condition: state
                entity: "entity:tomorrow_data_available"
                state: "off"
            content: <ha-alert alert-type="info">[[label:tomorrow_pending]]</ha-alert>
          - type: glance
            visibility:
              - condition: state
                entity: "entity:tomorrow_data_available"
                state: "on"
            columns: 3
            entities:
              - entity: "entity:lowest_price_tomorrow"
                name: "label:lowest"
              - entity: "entity:average_price_tomorrow"
                name: "label:average"
              - entity: "entity:highest_price_tomorrow"
                name: "label:highest"

  # Question 4: why? Everything secondary lives here.
  - title: Details
    path: details
    icon: mdi:information-outline
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: heading
            heading: "label:best_price"
            badges:
              - type: entity
                entity: "entity:best_price_period"
                tap_action: {action: more-info}
                show_state: true
                show_icon: true
          - type: entities
            entities:
              - entity: "entity:best_price_next_start_time"
                name: "label:starts"
              - entity: "entity:best_price_end_time"
                name: "label:ends"
              - entity: "entity:best_price_next_in_minutes"
                name: "label:starts_in"
              - entity: "entity:best_price_remaining_minutes"
                name: "label:remaining"
              - entity: "entity:best_price_progress"
                name: "label:progress"
      - type: grid
        cards:
          - type: heading
            heading: "label:peak_price"
            badges:
              - type: entity
                entity: "entity:peak_price_period"
                tap_action: {action: more-info}
                show_state: true
                show_icon: true
          - type: entities
            entities:
              - entity: "entity:peak_price_next_start_time"
                name: "label:starts"
              - entity: "entity:peak_price_end_time"
                name: "label:ends"
              - entity: "entity:peak_price_next_in_minutes"
                name: "label:starts_in"
              - entity: "entity:peak_price_remaining_minutes"
                name: "label:remaining"
              - entity: "entity:peak_price_progress"
                name: "label:progress"
      - type: grid
        cards:
          - type: heading
            heading: "label:levels"
          - type: entities
            entities:
              - entity: "entity:current_interval_price_level"
                name: "label:current_interval"
              - entity: "entity:next_interval_price_level"
                name: "label:next_interval"
              - entity: "entity:current_hour_price_level"
                name: "label:current_hour"
              - entity: "entity:next_hour_price_level"
                name: "label:next_hour"
      - type: grid
        cards:
          - type: heading
            heading: "label:trends"
          - type: entities
            entities:
              - entity: "entity:current_price_trend"
                name: "label:trend"
              - entity: "entity:next_price_trend_change"
                name: "label:next_trend_change"
              - entity: "entity:current_price_phase"
                name: "label:phase"
              - entity: "entity:next_price_phase"
                name: "label:next_phase"
              - entity: "entity:price_outlook_3h"
                name: "label:outlook_3h"
              - entity: "entity:day_pattern_today"
                name: "label:pattern"
