type: custom:config-template-card
variables:
  v_graph_span: 'const now = new Date(); const currentMinute = now.getMinutes(); const
    nextQuarterMinute = Math.ceil(currentMinute / 15) * 15; const currentIntervalEnd
    = new Date(now); if (nextQuarterMinute === 60) {   currentIntervalEnd.setHours(now.getHours()
    + 1, 0, 0, 0); } else {   currentIntervalEnd.setMinutes(nextQuarterMinute, 0,
    0); } const midnight = new Date(now.getFullYear(), now.getMonth(), now.getDate()
    + 1, 0, 0, 0); const minutesFromIntervalEndToMidnight = Math.ceil((midnight -
    currentIntervalEnd) / 60000); const minutesRounded = Math.ceil(minutesFromIntervalEndToMidnight
    / 15) * 15; const lookback = 120; const hasTomorrowData = states[''binary_sensor.vitahuset_morgige_daten_verfugbar''].state
    === ''on''; const totalMinutes = lookback + minutesRounded + (hasTomorrowData
    ? 1440 : 0); totalMinutes + ''min'';'
  v_yaxis_min: states['sensor.vitahuset_diagramm_metadaten'].attributes.yaxis_min
  v_yaxis_max: states['sensor.vitahuset_diagramm_metadaten'].attributes.yaxis_max
entities:
- binary_sensor.vitahuset_morgige_daten_verfugbar
- sensor.vitahuset_aktueller_strompreis
- sensor.vitahuset_diagramm_metadaten
card:
  type: custom:apexcharts-card
  update_interval: 5m
  header:
    show: true
    title: Price Level
    show_states: false
  apex_config:
    chart:
      animations:
        enabled: false
      toolbar:
        show: true
        tools:
          zoom: true
          pan: true
      zoom:
        enabled: true
    stroke:
      curve: stepline
    fill:
      type: gradient
      opacity: 0.45
      gradient:
        shade: light
        type: vertical
        shadeIntensity: 0.2
        opacityFrom:
        - 0.5
        - 0.7
        - 0.7
        - 0.7
        - 0.7
        - 0.7
        opacityTo: 0.25
        stops:
        - 50
        - 100
    dataLabels:
      enabled: false
    legend:
      show: true
      position: bottom
      horizontalAlign: center
      markers:
        size: 0
      itemMargin:
        horizontal: 15
    grid:
      show: true
      borderColor: rgba(144, 164, 174, 0.35)
      strokeDashArray: 0
      xaxis:
        lines:
          show: false
      yaxis:
        lines:
          show: true
    markers:
      size: 0
      hover:
        size: 3
      colors: '#ff0000'
      fillOpacity: 0.5
      strokeWidth: 5
      strokeColors: '#ff0000'
      strokeOpacity: 0.15
      showNullDataPoints: false
    tooltip:
      enabled: true
      shared: true
      enabledOnSeries:
      - 2
      - 3
      - 4
      - 5
      - 6
      marker:
        show: false
      x:
        show: false
  yaxis:
  - id: price
    min: ${v_yaxis_min}
    max: ${v_yaxis_max}
    apex_config:
      title:
        text: kr/kWh
      decimalsInFloat: 1
      forceNiceScale: true
      showAlways: true
      tickAmount: 4
  - id: highlight
    min: 0
    max: 1
    show: false
    opposite: true
    apex_config:
      forceNiceScale: true
      tickAmount: 4
  now:
    show: true
    color: '#8e24aa'
  all_series_config:
    float_precision: 2
  series:
  - entity: sensor.vitahuset_mindestpreis_heute
    name: ▼ Best Price Period
    type: area
    color: rgba(46, 204, 113, 0.05)
    yaxis_id: highlight
    show:
      legend_value: false
      in_header: false
      in_legend: true
    data_generator: 'const response = await hass.callWS({ type: ''call_service'',
      domain: ''tibber_prices'', service: ''get_chartdata'', return_response: true,
      service_data: { entry_id: ''01KZG6XVZXMBW255DS1R3ZSF3K'', period_filter: ''best_price'',
      resolution: ''interval'', output_format: ''array_of_arrays'', insert_nulls:
      ''segments'', subunit_currency: false, price_source: ''total'' } }); const originalData
      = response.response.data; return originalData.map((point, i) => { const result
      = [point[0], point[1] === null ? null : 1]; result.originalPrice = point[1];
      return result; });'
    stroke_width: 0
  - entity: sensor.vitahuset_mindestpreis_heute
    name: ▲ Peak Price Period
    type: area
    color: rgba(231, 76, 60, 0.06)
    yaxis_id: highlight
    show:
      legend_value: false
      in_header: false
      in_legend: true
      hidden_by_default: true
    data_generator: 'const response = await hass.callWS({ type: ''call_service'',
      domain: ''tibber_prices'', service: ''get_chartdata'', return_response: true,
      service_data: { entry_id: ''01KZG6XVZXMBW255DS1R3ZSF3K'', period_filter: ''peak_price'',
      resolution: ''interval'', output_format: ''array_of_arrays'', insert_nulls:
      ''segments'', subunit_currency: false, price_source: ''total'' } }); const originalData
      = response.response.data; return originalData.map((point, i) => { const result
      = [point[0], point[1] === null ? null : 1]; result.originalPrice = point[1];
      return result; });'
    stroke_width: 0
  - entity: sensor.vitahuset_mindestpreis_heute
    name: Very cheap
    type: area
    color: '#2ecc71'
    yaxis_id: price
    show:
      legend_value: false
      in_header: false
      in_legend: false
    data_generator: 'const response = await hass.callWS({ type: ''call_service'',
      domain: ''tibber_prices'', service: ''get_chartdata'', return_response: true,
      service_data: { entry_id: ''01KZG6XVZXMBW255DS1R3ZSF3K'', level_filter: [''VERY_CHEAP''],
      resolution: ''interval'', output_format: ''array_of_arrays'', insert_nulls:
      ''segments'', subunit_currency: false, price_source: ''total'', connect_segments:
      true } }); return response.response.data;'
    stroke_width: 1.5
  - entity: sensor.vitahuset_mindestpreis_heute
    name: Cheap
    type: area
    color: '#27ae60'
    yaxis_id: price
    show:
      legend_value: false
      in_header: false
      in_legend: false
    data_generator: 'const response = await hass.callWS({ type: ''call_service'',
      domain: ''tibber_prices'', service: ''get_chartdata'', return_response: true,
      service_data: { entry_id: ''01KZG6XVZXMBW255DS1R3ZSF3K'', level_filter: [''CHEAP''],
      resolution: ''interval'', output_format: ''array_of_arrays'', insert_nulls:
      ''segments'', subunit_currency: false, price_source: ''total'', connect_segments:
      true } }); return response.response.data;'
    stroke_width: 1.5
  - entity: sensor.vitahuset_preis_heute
    name: Normal
    type: area
    color: '#f1c40f'
    yaxis_id: price
    show:
      legend_value: false
      in_header: false
      in_legend: false
    data_generator: 'const response = await hass.callWS({ type: ''call_service'',
      domain: ''tibber_prices'', service: ''get_chartdata'', return_response: true,
      service_data: { entry_id: ''01KZG6XVZXMBW255DS1R3ZSF3K'', level_filter: [''NORMAL''],
      resolution: ''interval'', output_format: ''array_of_arrays'', insert_nulls:
      ''segments'', subunit_currency: false, price_source: ''total'', connect_segments:
      true } }); return response.response.data;'
    stroke_width: 1.5
  - entity: sensor.vitahuset_hochstpreis_heute
    name: Expensive
    type: area
    color: '#e67e22'
    yaxis_id: price
    show:
      legend_value: false
      in_header: false
      in_legend: false
    data_generator: 'const response = await hass.callWS({ type: ''call_service'',
      domain: ''tibber_prices'', service: ''get_chartdata'', return_response: true,
      service_data: { entry_id: ''01KZG6XVZXMBW255DS1R3ZSF3K'', level_filter: [''EXPENSIVE''],
      resolution: ''interval'', output_format: ''array_of_arrays'', insert_nulls:
      ''segments'', subunit_currency: false, price_source: ''total'', connect_segments:
      true } }); return response.response.data;'
    stroke_width: 1.5
  - entity: sensor.vitahuset_hochstpreis_heute
    name: Very expensive
    type: area
    color: '#e74c3c'
    yaxis_id: price
    show:
      legend_value: false
      in_header: false
      in_legend: false
    data_generator: 'const response = await hass.callWS({ type: ''call_service'',
      domain: ''tibber_prices'', service: ''get_chartdata'', return_response: true,
      service_data: { entry_id: ''01KZG6XVZXMBW255DS1R3ZSF3K'', level_filter: [''VERY_EXPENSIVE''],
      resolution: ''interval'', output_format: ''array_of_arrays'', insert_nulls:
      ''segments'', subunit_currency: false, price_source: ''total'', connect_segments:
      true } }); return response.response.data;'
    stroke_width: 1.5
  experimental:
    hidden_by_default: true
  span:
    start: minute
    offset: -120min
  graph_span: ${v_graph_span}
