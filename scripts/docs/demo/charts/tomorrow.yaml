type: custom:apexcharts-card
update_interval: 5m
header:
  show: true
  title: Price Level - Tomorrow
  show_states: false
apex_config:
  chart:
    animations:
      enabled: false
    toolbar:
      show: true
      tools:
        zoom: true
        pan: true
    zoom:
      enabled: true
  stroke:
    curve: stepline
  fill:
    type: gradient
    opacity: 0.45
    gradient:
      shade: light
      type: vertical
      shadeIntensity: 0.2
      opacityFrom:
      - 0.5
      - 0.7
      - 0.7
      - 0.7
      - 0.7
      - 0.7
      opacityTo: 0.25
      stops:
      - 50
      - 100
  dataLabels:
    enabled: false
  legend:
    show: true
    position: bottom
    horizontalAlign: center
    markers:
      size: 0
    itemMargin:
      horizontal: 15
  grid:
    show: true
    borderColor: rgba(144, 164, 174, 0.35)
    strokeDashArray: 0
    xaxis:
      lines:
        show: false
    yaxis:
      lines:
        show: true
  markers:
    size: 0
    hover:
      size: 3
    colors: '#ff0000'
    fillOpacity: 0.5
    strokeWidth: 5
    strokeColors: '#ff0000'
    strokeOpacity: 0.15
    showNullDataPoints: false
  tooltip:
    enabled: true
    shared: true
    enabledOnSeries:
    - 2
    - 3
    - 4
    - 5
    - 6
    marker:
      show: false
    x:
      show: false
yaxis:
- id: price
  apex_config:
    title:
      text: kr/kWh
- id: highlight
  min: 0
  max: 1
  show: false
  opposite: true
  apex_config:
    forceNiceScale: true
    tickAmount: 4
now:
  show: true
  color: '#8e24aa'
  label: 🕒 LIVE
all_series_config:
  float_precision: 2
series:
- entity: sensor.vitahuset_mindestpreis_morgen
  name: ▼ Best Price Period
  type: area
  color: rgba(46, 204, 113, 0.05)
  yaxis_id: highlight
  show:
    legend_value: false
    in_header: false
    in_legend: true
  data_generator: 'const response = await hass.callWS({ type: ''call_service'', domain:
    ''tibber_prices'', service: ''get_chartdata'', return_response: true, service_data:
    { entry_id: ''01KZG6XVZXMBW255DS1R3ZSF3K'', day: [''tomorrow''], period_filter:
    ''best_price'', resolution: ''interval'', output_format: ''array_of_arrays'',
    insert_nulls: ''segments'', subunit_currency: false, price_source: ''total'' }
    }); const originalData = response.response.data; return originalData.map((point,
    i) => { const result = [point[0], point[1] === null ? null : 1]; result.originalPrice
    = point[1]; return result; });'
  stroke_width: 0
- entity: sensor.vitahuset_mindestpreis_morgen
  name: ▲ Peak Price Period
  type: area
  color: rgba(231, 76, 60, 0.06)
  yaxis_id: highlight
  show:
    legend_value: false
    in_header: false
    in_legend: true
    hidden_by_default: true
  data_generator: 'const response = await hass.callWS({ type: ''call_service'', domain:
    ''tibber_prices'', service: ''get_chartdata'', return_response: true, service_data:
    { entry_id: ''01KZG6XVZXMBW255DS1R3ZSF3K'', day: [''tomorrow''], period_filter:
    ''peak_price'', resolution: ''interval'', output_format: ''array_of_arrays'',
    insert_nulls: ''segments'', subunit_currency: false, price_source: ''total'' }
    }); const originalData = response.response.data; return originalData.map((point,
    i) => { const result = [point[0], point[1] === null ? null : 1]; result.originalPrice
    = point[1]; return result; });'
  stroke_width: 0
- entity: sensor.vitahuset_mindestpreis_morgen
  name: Very cheap
  type: area
  color: '#2ecc71'
  yaxis_id: price
  show:
    legend_value: false
    in_header: false
    in_legend: false
  data_generator: 'const response = await hass.callWS({ type: ''call_service'', domain:
    ''tibber_prices'', service: ''get_chartdata'', return_response: true, service_data:
    { entry_id: ''01KZG6XVZXMBW255DS1R3ZSF3K'', day: [''tomorrow''], level_filter:
    [''VERY_CHEAP''], resolution: ''interval'', output_format: ''array_of_arrays'',
    insert_nulls: ''segments'', subunit_currency: false, price_source: ''total'',
    connect_segments: true } }); return response.response.data;'
  stroke_width: 1.5
- entity: sensor.vitahuset_mindestpreis_morgen
  name: Cheap
  type: area
  color: '#27ae60'
  yaxis_id: price
  show:
    legend_value: false
    in_header: false
    in_legend: false
  data_generator: 'const response = await hass.callWS({ type: ''call_service'', domain:
    ''tibber_prices'', service: ''get_chartdata'', return_response: true, service_data:
    { entry_id: ''01KZG6XVZXMBW255DS1R3ZSF3K'', day: [''tomorrow''], level_filter:
    [''CHEAP''], resolution: ''interval'', output_format: ''array_of_arrays'', insert_nulls:
    ''segments'', subunit_currency: false, price_source: ''total'', connect_segments:
    true } }); return response.response.data;'
  stroke_width: 1.5
- entity: sensor.vitahuset_preis_morgen
  name: Normal
  type: area
  color: '#f1c40f'
  yaxis_id: price
  show:
    legend_value: false
    in_header: false
    in_legend: false
  data_generator: 'const response = await hass.callWS({ type: ''call_service'', domain:
    ''tibber_prices'', service: ''get_chartdata'', return_response: true, service_data:
    { entry_id: ''01KZG6XVZXMBW255DS1R3ZSF3K'', day: [''tomorrow''], level_filter:
    [''NORMAL''], resolution: ''interval'', output_format: ''array_of_arrays'', insert_nulls:
    ''segments'', subunit_currency: false, price_source: ''total'', connect_segments:
    true } }); return response.response.data;'
  stroke_width: 1.5
- entity: sensor.vitahuset_hochstpreis_morgen
  name: Expensive
  type: area
  color: '#e67e22'
  yaxis_id: price
  show:
    legend_value: false
    in_header: false
    in_legend: false
  data_generator: 'const response = await hass.callWS({ type: ''call_service'', domain:
    ''tibber_prices'', service: ''get_chartdata'', return_response: true, service_data:
    { entry_id: ''01KZG6XVZXMBW255DS1R3ZSF3K'', day: [''tomorrow''], level_filter:
    [''EXPENSIVE''], resolution: ''interval'', output_format: ''array_of_arrays'',
    insert_nulls: ''segments'', subunit_currency: false, price_source: ''total'',
    connect_segments: true } }); return response.response.data;'
  stroke_width: 1.5
- entity: sensor.vitahuset_hochstpreis_morgen
  name: Very expensive
  type: area
  color: '#e74c3c'
  yaxis_id: price
  show:
    legend_value: false
    in_header: false
    in_legend: false
  data_generator: 'const response = await hass.callWS({ type: ''call_service'', domain:
    ''tibber_prices'', service: ''get_chartdata'', return_response: true, service_data:
    { entry_id: ''01KZG6XVZXMBW255DS1R3ZSF3K'', day: [''tomorrow''], level_filter:
    [''VERY_EXPENSIVE''], resolution: ''interval'', output_format: ''array_of_arrays'',
    insert_nulls: ''segments'', subunit_currency: false, price_source: ''total'',
    connect_segments: true } }); return response.response.data;'
  stroke_width: 1.5
experimental:
  hidden_by_default: true
span:
  start: day
  offset: +1d
